plugins {
	id 'net.neoforged.moddev' version "${moddev_version}"
}

// The mod's code and resources are shared with the Fabric build in the repository root; this folder only adds what
// NeoForge needs (its mods.toml, the @Mod class and its LoaderPaths).
def shared = new Properties()
file('../gradle.properties').withInputStream { shared.load(it) }
version = shared.getProperty('version')
group = shared.getProperty('group')
base { archivesName = "ciderlight-neoforge" }

sourceSets.main {
	java.srcDirs = ['../src/main/java', 'src/main/java']
	resources.srcDirs = ['../src/main/resources', 'src/main/resources']
	resources.exclude 'fabric.mod.json'
}

neoForge {
	version = neo_version
	runs {
		client {
			client()
			jvmArgument '--enable-native-access=ALL-UNNAMED'
			if (project.hasProperty("world")) {
				programArguments.addAll '--quickPlaySingleplayer', project.property("world").toString()
			}
			if (project.hasProperty("trace")) {
				systemProperty 'ciderlight.trace', 'true'
			}
		}
	}
	mods {
		ciderlight {
			sourceSet sourceSets.main
		}
	}
}

// Objective-C bridge to Metal, compiled with the system clang and bundled in the jar (as in the Fabric build).
def nativeSrc = file("../src/main/native")
def nativeOut = layout.buildDirectory.file("native/libciderlight.dylib")
tasks.register('buildNative', Exec) {
	inputs.dir nativeSrc
	outputs.file nativeOut
	doFirst { nativeOut.get().asFile.parentFile.mkdirs() }
	commandLine 'clang', '-dynamiclib', '-fobjc-arc', '-O2', '-arch', 'arm64',
		'-mmacosx-version-min=14.0', '-Wall',
		'-framework', 'Metal', '-framework', 'QuartzCore', '-framework', 'Foundation', '-framework', 'AppKit',
		'-o', nativeOut.get().asFile.absolutePath,
		"${nativeSrc}/ciderlight.m"
}

processResources {
	dependsOn 'buildNative'
	from(nativeOut) { into 'natives' }
	def version = project.version
	inputs.property "version", version
	filesMatching("META-INF/neoforge.mods.toml") { expand "version": version }
	from(file("../LICENSE")) { into 'META-INF' }
	from(file("../NOTICE")) { into 'META-INF' }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java {
	toolchain { languageVersion = JavaLanguageVersion.of(25) }
}
